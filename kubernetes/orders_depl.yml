apiVersion: apps/v1
kind: Deployment 
metadata:
  name: ordersdepl
  namespace: microapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
      - image: sahild42770/orders
        name: orders-cont
        ports:
        - containerPort: 3000
