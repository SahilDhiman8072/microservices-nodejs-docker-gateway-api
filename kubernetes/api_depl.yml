apiVersion: apps/v1
kind: Deployment 
metadata:
  name: apidepl
  namespace: microapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - image: sahild42770/api_gateway
        name: api-cont
        ports:
        - containerPort: 3007