apiVersion: apps/v1
kind: Deployment 
metadata:
  name: productdepl
  namespace: microapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: products
  template:
    metadata:
      labels:
        app: products
    spec:
      containers:
      - image: sahild42770/products
        name: product-cont
        ports:
        - containerPort: 3000